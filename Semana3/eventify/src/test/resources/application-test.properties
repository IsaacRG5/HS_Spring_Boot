spring.application.name=eventify-test
eventify.seeder.enabled=false

# Base de datos H2 en memoria, exclusiva para pruebas (no toca los datos reales)
spring.datasource.url=jdbc:h2:mem:eventify_test;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
spring.h2.console.enabled=false
