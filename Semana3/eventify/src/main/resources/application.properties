spring.application.name=eventify

# Toggle del seeder inicial. En false, el catalogo arranca vacio (Escenario 3 de la HU)
eventify.seeder.enabled=true

# --- Persistencia real (Spring Data JPA + Hibernate) ---
# Base de datos H2 en modo ARCHIVO: los datos se guardan en ./data/eventifydb
# y sobreviven a un apagado/encendido de la aplicacion (Escenario 1 de la HU).
spring.datasource.url=jdbc:h2:file:./data/eventifydb;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# "update": crea/actualiza las tablas segun las entidades, sin borrar datos existentes
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Consola web de H2 (util para inspeccionar los datos persistidos)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# --- Panel administrativo (Thymeleaf) ---
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

# --- Separacion de rutas: Swagger solo documenta la API (/api/**), ---
# --- nunca las vistas del panel (/admin/**) ---
springdoc.paths-to-match=/api/**

# Personalizacion de Swagger / OpenAPI
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.doc-expansion=none
